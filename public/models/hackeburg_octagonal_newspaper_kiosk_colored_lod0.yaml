design_notes:
  stage: 2 - PBR paving texture on coloured LOD0 geometry
  reference: Hackeburg architectural CAD sheet with front/side/top/isometric octagonal kiosk
  roof: Exact 8-sided frustum, not a stack of square boxes. Eight inclined trapezoid planes generated in Three.js.
  facade: Eight radial glazing bays with frames; the front bay has a double leaf glass door.
  geometry: Glass and frames use rotation_y and a shared geometric mesh; the roof has true inclines.
  known_limits: Signs and newspapers are currently represented with coloured geometry, not typography or textured
    art. SVG renderer uses polygon triangulation and simplified depth sorting. No artificial building behind this
    kiosk.
  excluded: Litfasssaeule, bollards and broader plaza intentionally excluded.
  paving_texture: Poly Haven cobblestone_pavement; maps are distributed separately in public/textures/cobblestone_pavement. Displacement not used; paving joints are now in the texture, not modeled.
