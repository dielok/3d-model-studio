kind: scene_asset
style: hamburg_2026_octagonal_kiosk
description: CAD-based eight-sided freestanding newspaper kiosk with true 8-sided wall structure, radial glazing,
  inclined octagonal roof, glazed cupola, original dark-green and ivory color palette, 4x4 paved base, two flower
  planters and chalkboard. No Minecraft/stair-stepped roof proxies. Litfass column excluded as requested for this
  single-kiosk asset.
